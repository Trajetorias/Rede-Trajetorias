vos conhecimentos, pesquisa, acesso a tecnologias, especialização de nível mundial, benchmark global.", "7 de 8"], ["Rede e conexões", "Rede pessoal, institucional e acadêmica, conexão internacional, contato com especialistas e lideranças globais.", "7 de 8"], ["Experiência multicultural", "Multiculturalidade, quebra de paradigmas, outras perspectivas de mundo, idioma e cultura.", "6 de 8"], ["Carreira e empregabilidade", "Melhores oportunidades, progressão e transição de carreira, currículo robusto, carreira de pesquisador.", "5 de 8"], ["Transformação pessoal e mobilidade social", "Recomeço, crescimento pessoal, mobilidade social, propósito, retribuir o investimento social.", "4 de 8"], ["Liderança e protagonismo", "Desenvolvimento de novas lideranças, representatividade, protagonismo do aluno.", "2 de 8"], ["Interdisciplinaridade", "União de áreas do conhecimento e integração de conhecimentos globais.", "2 de 8"]]}, "p2": {"titulo": "Como a rede pode ajudar", "n": "41 respostas", "rows": [["Ponte para a volta e recolocação", "Conectar com pessoas e instituições no Brasil, apoio à colocação, plano de carreira e inserção no mercado brasileiro.", "6 de 8"], ["Rede de apoio e pertencimento", "Uma rede para o período fora, comunidade, coletividade, amparo entre pesquisadores.", "5 de 8"], ["Conexão dirigida por área e tema", "Conectar pessoas de governo e indústria por área, contatos que geram oportunidades.", "5 de 8"], ["Suporte operacional e financeiro", "Suporte financeiro e logístico, documentação, orientação ao longo do mestrado.", "4 de 8"], ["Multiplicação de impacto", "Interligar agentes para viabilizar projetos, proximidade com quem quer transformar o Brasil.", "3 de 8"], ["Encontros e contato com quem já passou", "Eventos, projetos e encontros com egressos durante o programa.", "2 de 8"], ["Vínculos duradouros e mediação", "Vínculos longevos, papel de mediador, valorização e representação.", "2 de 8"]]}, "insights": [["A expectativa dominante é de retorno, não de saída", "Em sete das oito mesas o mestrado aparece como meio para resolver um problema brasileiro nomeado. Quase nenhuma resposta trata a experiência internacional como um fim em si. Confirma a premissa de que o diferencial está no mercado e nos problemas brasileiros."], ["Rede já é expectativa do próprio mestrado", "Rede de contatos aparece como resposta sobre o mestrado em sete das oito mesas. A Rede Trajetórias entra num campo onde a universidade também atua, então o filtro do que ela não faz, sobretudo a ligação com o Brasil, segue sendo o critério certo."], ["O verbo pedido é conectar, não reunir", "As respostas raramente pedem um espaço de encontro. Pedem que alguém faça a ligação por área, setor, habilidade e destino. Valida o pareamento em duas camadas e eleva a exigência sobre a capacidade de parear."], ["Parte do que pedem é operação do Instituto, não da rede", "Suporte financeiro, alocação e documentação aparecem em quatro mesas como resposta sobre a rede. A comunicação precisa separar o que é obrigação de programa, o que é serviço do Instituto e o que é a rede."]]}, "estrategia": {"north": "Formar uma rede de talentos brasileiros que acompanha cada trajetória.", "north_txt": "O verbo é formar, não conectar. A rede ainda não existe e o Instituto é invisível na sua formação, então o papel é construí-la, não apenas ligar quem já está junto. O norte é estável e não se replaneja a cada ano.", "pilares": [["Pertencimento", "Sentir-se parte desde o dia zero. Uma rede que cuida.", "#264CA1"], ["Carreira", "A ponte de volta ao Brasil, que a universidade não faz.", "#C9A24B"], ["Impacto no Brasil", "O conhecimento aplicado ao país, como resultado de longo prazo.", "#1E7A34"]], "principios": [["Estudante como ativo", "A pessoa é agente, não beneficiário passivo."], ["Experiência compartilhada", "A rede se constrói com quem já passou pela mesma trajetória."], ["Escala peer-to-peer", "Cada turma que volta acolhe a seguinte. Escala sem crescer a equipe."]], "matriz": "Cada iniciativa vive no cruzamento de um pilar com um princípio. É isso que dá coerência ao conjunto e permite priorizar: pergunta-se qual pilar a iniciativa serve e por qual mecanismo ela acontece."}, "parcerias": {"intro": "Prioridade um da trilha de carreira. Meta institucional de 5 parcerias em 2026 e nenhuma firmada até aqui. É o item de maior esforço, maior valor e o único com meta formal.", "ancoragem": "Os editais exigem retorno ao Brasil e aplicação do conhecimento no estado de origem, pelo mesmo período da bolsa. Isso torna a prospecção naturalmente regional e converte a agência estadual de financiadora em parceira interessada no resultado.", "canais": [{"n": "Mercado aberto", "cor": "#264CA1", "sub": "Empresas que valorizam experiência internacional", "pts": ["Prospecção por área estratégica e por região de retorno.", "Acordo de intenção: priorizar e entrevistar os currículos da rede.", "Alvos com dor real de contratação qualificada."], "ex": "Saúde: redes hospitalares e healthtechs. Clima: indústrias com área de sustentabilidade."}, {"n": "Ecossistema Lemann", "cor": "#C9A24B", "sub": "O acesso que o Instituto já tem", "pts": ["Alumni e egressos da Fundação Lemann e programas parceiros.", "Líderes já colocados em organizações de impacto.", "Indicação vale mais que candidatura fria."], "ex": "Organizações de impacto social e climático próximas do ecossistema."}, {"n": "Setor público", "cor": "#1E7A34", "sub": "A agência estadual é parte interessada", "pts": ["Quem financiou a bolsa quer ver o conhecimento aplicado no estado.", "Secretarias e órgãos como destino e como parceiro.", "Para servidores: aplicar e crescer, não recolocar."], "ex": "Secretarias estaduais de saúde e meio ambiente de GO, RS e ES."}], "passos": [["1", "Mapear a demanda interna", "Por área e por região de retorno, a partir do formulário de outubro. Separar quem busca recolocação de quem é servidor."], ["2", "Prospectar pelos três canais", "Mercado por área e região, Lemann por indicação, agência estadual como parceira de destino."], ["3", "Firmar o acordo certo", "Cada canal tem sua moeda de troca: entrevista, indicação ou aplicação do conhecimento."], ["4", "Operar o pool e medir", "Pool por canal, área e região. Medir colocação efetiva e aplicação no estado, não número de acordos."]], "tiers": [["Tier 1", "Sempre recebe e analisa os currículos da rede, e prioriza candidatos Trajetórias nas vagas abertas."], ["Tier 2", "Além do Tier 1, abre vaga dedicada. Em troca, participa de eventos da rede e ganha visibilidade junto aos bolsistas."]], "prospeccao": "Prospectar por estado, via conglomerados e federações (a federação das indústrias do ES é um caminho já aberto), academia e organizações de saúde. Usar a base do Airtable, que registra onde os egressos trabalham hoje, para mapear organizações-alvo por estado.", "guard": "Acordo de intenção, não promessa de emprego. Medir a colocação real, não o número de acordos. O foco é a intencionalidade: acordos demoram, então começar cedo vale mais que bater a meta no papel."}, "capacidade": {"intro": "A pergunta que a proposta precisa responder: isso tudo cabe numa equipe de duas pessoas? A conta abaixo mostra que o contato pessoal cabe agora e deixa de caber por volta de 2029. É exatamente por isso que o buddy entra compulsório desde já.", "conta": [["Hoje, 1 coorte", "~73 pessoas", "55h por semestre", "cabe: 7 dias de trabalho", "#264CA1"], ["2027, 2 coortes", "~145 pessoas", "110h por semestre", "aperta: 14 dias", "#264CA1"], ["2028, 3 coortes", "~220 pessoas", "165h por semestre", "limite: 21 dias", "#C9A24B"], ["2029, 4 coortes", "~290 pessoas", "220h por semestre", "não cabe mais", "#B03A2E"]], "premissa": "Premissa: uma conversa de 45 minutos por pessoa por semestre, equipe de duas pessoas, coortes de tamanho parecido ao de 2026. Números para dimensionar ordem de grandeza, não projeção fechada.", "proj": [["2026", "73 na rede, nenhum egresso", "A equipe faz o contato pessoal. O buddy é entre pares que vão para o mesmo destino.", "#264CA1"], ["2027", "145 na rede, cerca de 15 de volta", "Os primeiros egressos assumem o buddy. A rede começa a se sustentar.", "#264CA1"], ["2028", "220 na rede, cerca de 60 de volta", "Massa para mentoria por demanda e parcerias com histórico de colocação.", "#C9A24B"], ["2030", "cerca de 365 na rede, 210 de volta", "Densidade regional em GO, RS e ES permite núcleos locais e dá poder de negociação.", "#1E7A34"]], "tese": "A capacidade de atender não precisa crescer junto com a rede: cada turma que volta vira a base de acolhimento da seguinte. O contato pessoal de hoje não é um custo que vai explodir, é o investimento que cria esse mecanismo.", "organizacao": "As iniciativas têm pesos e complexidades diferentes, por isso foram organizadas em dois níveis: a iniciativa (o quê) e as atividades (os passos de execução). Cada uma tem esforço estimado de implementação e manutenção, o que permitiu distribuir a carga ao longo do ano em vez de concentrar."}, "compliance": {"intro": "Cinco instrumentos que dão base de integridade à Rede, mais a arquitetura que mostra onde cada um entra na jornada. Todos em minuta, sujeitos à validação do Compliance Officer e do Encarregado de Proteção de Dados antes do uso.", "status": "Minuta para validação · pendente de Compliance Officer e DPO", "gov": "Governança provisória: o time do Instituto faz a primeira escuta e a triagem das questões de convivência, e os casos graves são conduzidos pelo Comitê de Governança, Riscos e Compliance do Instituto Lemann, responsável pelo Canal de Escuta Confidencial. À medida que a Rede cresce, a estrutura pode evoluir para uma instância própria.", "principio": "A separação que sustenta tudo: a participação na Rede não altera nem substitui as obrigações do termo de concessão da bolsa nem do contrato de crédito. O Instituto é entidade parceira e não decide sobre concessão, manutenção ou encerramento desses instrumentos. Sair da Rede não afeta a bolsa nem o crédito.", "arquitetura": [{"n": "1", "t": "Ingresso", "q": "ao ser aprovado", "tag": "Novo", "itens": ["Entrada automática na Rede", "Aceite único no formulário de integração", "Código de Conduta, Termo de Adesão e Consentimento no mesmo momento"], "obs": "Um aceite só, eletrônico. Não há assinatura em papel nem etapa separada."}, {"n": "2", "t": "Durante o curso", "q": "ao longo da jornada", "tag": "Novo", "itens": ["Regras de Convivência valendo nos canais", "Canal de Escuta aberto e divulgado", "Opt-ins de imagem e comunicação vigentes e revogáveis"], "obs": "É a fase em que as regras são vividas, não assinadas."}, {"n": "3", "t": "Retorno", "q": "até R+90", "tag": "Já existe", "itens": ["Nada novo a assinar", "Segue na Rede e pode virar buddy", "Depoimentos conforme a autorização dada no ingresso"], "obs": "O retorno não gera novo instrumento: o vínculo com a Rede é contínuo."}, {"n": "4", "t": "Vida na Rede", "q": "a cada ano", "tag": "Novo", "itens": ["Reafirmação do aceite na reinscrição anual", "Revisão anual do Código", "Permanência por tempo indeterminado"], "obs": "A reinscrição é o momento natural de reafirmar os acordos."}], "docs": [{"n": "01", "t": "Código de Conduta da Rede", "pub": "Membros", "o": "O documento central: define quem faz parte, os princípios, os compromissos de convivência e o que acontece quando algo sai da linha.", "destaques": ["Rede única: todos os aprovados, sem separação entre quem está em curso e quem voltou, independentemente do edital ou canal de entrada.", "Nove compromissos de convivência, entre eles respeito e não discriminação, cuidado com grupos vulneráveis, veracidade, conflito de interesses e uso do nome e da marca.", "Regra específica para quem atua como agente público, com os deveres próprios do cargo.", "Permanência por tempo indeterminado: períodos de menor participação são naturais e não geram desligamento.", "Saída a pedido por formulário próprio, ou por conduta grave observado o devido processo.", "Anexo I: Termo de Adesão, registrado por aceite eletrônico no formulário de integração."]}, {"n": "02", "t": "Termo de Consentimento e Autorizações", "pub": "Membros", "o": "Como o Instituto trata os dados na Rede e as autorizações que dependem de escolha do membro. As autorizações são independentes entre si.", "destaques": ["Tratamento necessário à operação apoiado no art. 7, incisos V e IX da LGPD: integração, acompanhamento, monitoramento de resultados, comunicação e eventos.", "Compartilhamento previsto com universidades parceiras, órgãos financiadores e, no caso do crédito, com o parceiro de crédito.", "Opt-in separado para comunicações institucionais, revogável sem prejuízo à permanência.", "Opt-in separado para uso de imagem, voz, nome e depoimento, sem finalidade comercial e sem contrapartida financeira.", "Direitos do titular pelo art. 18 da LGPD, exercidos junto ao Encarregado de Proteção de Dados."]}, {"n": "03", "t": "Matriz de Gestão de Consequências", "pub": "Uso interno", "o": "Apoio à decisão sobre medidas disciplinares. Documento interno, não distribuído aos membros.", "destaques": ["Dosimetria por seis parâmetros: circunstâncias, intenção, senioridade e papel, gravidade, exposição a risco e reincidência.", "Três níveis de gravidade (leve, média, grave), cada um com alcance, medida e quem aplica.", "Leve: orientação ou advertência, aplicada pelo time do Instituto.", "Média: advertência escrita, suspensão temporária ou desligamento conforme o caso, decidido pela instância.", "Grave: desligamento, decidido pelo Comitê de Governança, Riscos e Compliance.", "Registro interno das medidas para verificar reincidência, sem divulgação ao conjunto dos membros."]}, {"n": "04", "t": "Termo de Desligamento da Rede", "pub": "Membros", "o": "Formaliza a saída e as combinações que seguem valendo depois dela.", "destaques": ["Encerramento do vínculo com data definida: não integra mais a Rede, não participa de iniciativas exclusivas, não representa a Rede.", "Cessação imediata do uso do nome, marca e sinais distintivos; remoção de menções em até 10 dias úteis.", "Permitido o uso histórico e verídico da participação passada, sem marca e sem sugerir vínculo atual.", "Confidencialidade permanente sobre informações estratégicas e dados de outros membros.", "Registro explícito de que a saída é independente das obrigações da bolsa e do contrato de crédito."]}, {"n": "05", "t": "Regras de Convivência da Rede", "pub": "Membros", "o": "A versão curta e visual do Código, feita para circular nos canais. Cinco combinações que fortalecem e cinco cuidados que mantêm o respeito.", "destaques": ["Combinações: respeito sempre, troca que soma, privacidade, grupo certo e presença de verdade.", "Cuidados: zero discriminação, sem ruído comercial, sem desinformação, nada de vazamento e sem uso indevido.", "Vale em todos os canais da Rede: grupos por turma e por país de destino.", "Traz o Canal de Escuta no rodapé, para que o caminho de relato esteja sempre à vista."]}], "canal": {"t": "Canal de Escuta Confidencial", "d": "Seguro, gerido por consultoria externa, permite relato anônimo ou identificado. A identidade de quem relata é mantida em sigilo e quem relata de boa-fé é protegido contra retaliação.", "linhas": ["Telefone: 0800 892 2295", "E-mail: escutaconfidencial@helloethics.com", "Internet: www.helloethics.com/canaldeescutaconfidencial"]}, "pendencias": ["Revisão jurídica das minutas, com prazo sugerido até 15 de setembro.", "Validação do Compliance Officer e do Encarregado de Proteção de Dados.", "Confirmar o canal de escuta a ser divulgado aos membros da Rede.", "Definir quem, no time, faz a primeira triagem dos relatos.", "Incluir o aceite dos três instrumentos no formulário de integração."]}, "regua_full": [{"quando": "T0", "fase": "Adesão", "o_que": "Boas-vindas e entrada na Rede", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Acolhedor. Celebra a aprovação e explica o que é a rede.", "nota": "Pessoal, assinado por alguém do time."}, {"quando": "T0", "fase": "Adesão", "o_que": "Termo de adesão e código de conduta", "canal": "E-mail", "tipo": "Obrigação", "tom": "Formal, mas curto. É o aceite que formaliza a entrada.", "nota": "Anexo com o termo; registro do aceite."}, {"quando": "T0+7d", "fase": "Adesão", "o_que": "Convite para os canais da comunidade", "canal": "E-mail + Grupo WhatsApp", "tipo": "Iniciativa", "tom": "Convite leve. Explica quais grupos existem e o que se espera de cada um.", "nota": "Link do grupo geral e do grupo por país."}, {"quando": "T0+20d", "fase": "Pré-embarque", "o_que": "Convite para a reunião de boas-vindas por edital", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Prático. Data, pauta e o que trazer.", "nota": "Agrupado por edital: cada grupo tem obrigações diferentes."}, {"quando": "E-90", "fase": "Pré-embarque", "o_que": "Kit de pré-embarque: checklist e guia de visto", "canal": "E-mail", "tipo": "Obrigação + apoio", "tom": "Prático e tranquilizador. O foco é reduzir a ansiedade da burocracia.", "nota": "Material por destino. Reforçar no canal de avisos."}, {"quando": "E-60", "fase": "Pré-embarque", "o_que": "Diretório e mapa da coorte", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Conexão. Mostra quem mais vai para o mesmo destino.", "nota": "Gatilho natural para os grupos por país."}, {"quando": "E-45", "fase": "Pré-embarque", "o_que": "Apresentação do buddy", "canal": "E-mail + 1:1", "tipo": "Iniciativa", "tom": "Pessoal. Apresenta as duas pessoas e sugere o primeiro contato.", "nota": "O buddy assume o contato dali em diante."}, {"quando": "E-30", "fase": "Pré-embarque", "o_que": "Convite para a cerimônia de celebração", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Celebratório. É o marco simbólico da partida.", "nota": "Confirmar presença; logística no canal de avisos."}, {"quando": "E-30", "fase": "Pré-embarque", "o_que": "Entrevista de expectativas (agendamento)", "canal": "E-mail + 1:1", "tipo": "Iniciativa", "tom": "Convite individual. Deixa claro que é conversa, não avaliação.", "nota": "Agenda aberta; priorizar por perfil."}, {"quando": "E+7", "fase": "Chegada", "o_que": "Boas-vindas na chegada: você chegou", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Acolhedor e prático. Reconhece o momento e aponta o career center da universidade.", "nota": "O primeiro contato depois do desembarque. Não deixar passar."}, {"quando": "E+15", "fase": "Chegada", "o_que": "Convite para a roda de chegada e agenda aberta", "canal": "E-mail + Grupo WhatsApp", "tipo": "Iniciativa", "tom": "Informal. É sobre adaptação e bem-estar, não sobre desempenho.", "nota": "Considerar fuso horário; pode haver duas sessões."}, {"quando": "E+60 (outubro)", "fase": "Chegada", "o_que": "Formulário de carreira", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Direcionado. Explica para que serve cada bloco e o que será feito com a resposta.", "nota": "Dois meses após a chegada, quando já dá para responder com base na experiência."}, {"quando": "Trimestral", "fase": "Estudos", "o_que": "Convite para o evento da rede", "canal": "E-mail + Canal de avisos", "tipo": "Iniciativa", "tom": "Convite, com o tema em destaque.", "nota": "O primeiro é sobre adaptação; os seguintes, sobre carreira."}, {"quando": "Semestral", "fase": "Estudos", "o_que": "Formulário semestral da rede", "canal": "E-mail", "tipo": "Obrigação leve", "tom": "Acompanhamento. Curto e com retorno do que foi feito com as respostas anteriores.", "nota": "Cinco dimensões do check-in."}, {"quando": "Conforme edital", "fase": "Estudos", "o_que": "Lembrete de relatório e comprovação", "canal": "E-mail + Canal de avisos", "tipo": "Obrigação", "tom": "Lembrete: o requisito é seu, e nós ajudamos a cumprir.", "nota": "Agrupado por edital. ES é trimestral; os demais, semestral."}, {"quando": "Anual", "fase": "Estudos", "o_que": "Convite para o encontro anual online", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Convite. Momento de reencontro de toda a rede.", "nota": "Toda a rede, não só a coorte."}, {"quando": "Conforme demanda", "fase": "Estudos", "o_que": "Convite para escuta e conexão", "canal": "E-mail + 1:1", "tipo": "Iniciativa", "tom": "Pessoal e direto. Sem pauta formal.", "nota": "Seletivo, priorizado por perfil e engajamento."}, {"quando": "C-90", "fase": "Pré-retorno", "o_que": "Check-in de pré-retorno e plano de aplicação", "canal": "E-mail + 1:1", "tipo": "Iniciativa + obrigação", "tom": "Prático. Liga a obrigação do edital ao plano real de volta.", "nota": "Marca o início do ciclo de retorno."}, {"quando": "C-90", "fase": "Pré-retorno", "o_que": "Kit de retorno e calendário de recrutamento BR", "canal": "E-mail", "tipo": "Iniciativa + apoio", "tom": "Prático. O mercado brasileiro recruta em janelas próprias.", "nota": "Material atualizado uma vez por ano."}, {"quando": "C-60", "fase": "Pré-retorno", "o_que": "Convite para o workshop de mercado brasileiro", "canal": "E-mail", "tipo": "Iniciativa", "tom": "Convite. Foco em traduzir a experiência para o Brasil.", "nota": "Uma sessão por ciclo de conclusão."}, {"quando": "C-60", "fase": "Pré-retorno", "o_que": "Lembrete das obrigações de retorno do edital", "canal": "E-mail", "tipo": "Obrigação", "tom": "Lembrete formal. Prazos e documentos exigidos.", "nota": "Prazos variam por edital: GO exige retorno em 90 dias."}, {"quando": "R+30", "fase": "Retorno", "o_que": "Boas-vindas de volta e check-in de retorno", "canal": "E-mail + 1:1", "tipo": "Iniciativa", "tom": "Acolhedor. Reconhece que voltar também é transição.", "nota": "Marca a entrada na fase de egressos."}, {"quando": "R+30", "fase": "Retorno", "o_que": "Compliance de saída e prestação de contas", "canal": "E-mail", "tipo": "Obrigação", "tom": "Formal. Documentação final do edital.", "nota": "Fecha o ciclo formal com a agência."}, {"quando": "R+60", "fase": "Retorno", "o_que": "Convite para a roda de retorno", "canal": "E-mail + Grupo WhatsApp", "tipo": "Iniciativa", "tom": "Convite. Turmas misturadas, quem voltou antes ajuda quem chegou agora.", "nota": "Janela semestral."}, {"quando": "R+90", "fase": "Retorno", "o_que": "Formulário pós-retorno", "canal": "E-mail", "tipo": "Obrigação leve", "tom": "Acompanhamento. Onde a pessoa está e se busca recolocação.", "nota": "Alimenta o pool de parcerias."}, {"quando": "Anual", "fase": "Egressos", "o_que": "Recadastro do egresso", "canal": "E-mail", "tipo": "Obrigação leve", "tom": "Curto. Atualização de onde está e o que faz.", "nota": "Base do censo da rede."}, {"quando": "Anual", "fase": "Egressos", "o_que": "Convite para o encontro anual da Rede", "canal": "E-mail + Canal de avisos", "tipo": "Iniciativa", "tom": "Celebratório. O reencontro presencial da rede inteira.", "nota": "Antes do embarque da turma nova."}, {"quando": "Contínuo", "fase": "Egressos", "o_que": "Oportunidades exclusivas da rede", "canal": "Canal de avisos", "tipo": "Iniciativa", "tom": "Objetivo. Vaga, prazo e como se candidatar.", "nota": "Vem do pool de parcerias."}, {"quando": "Contínuo", "fase": "Egressos", "o_que": "Convite para ser buddy da turma seguinte", "canal": "E-mail + 1:1", "tipo": "Iniciativa", "tom": "Convite com reconhecimento. É a principal contrapartida pedida.", "nota": "Priorizar quem está em nível aliado ou acima."}], "cal_detalhe": [{"mes": "Setembro 2026", "sub": "1º mês de aula · o vínculo se estabelece", "cor": "#264CA1", "foco": "A turma acabou de chegar. É a janela de maior abertura do ano: quem é acolhido agora responde o resto do ciclo.", "semanas": [["Semana 1", "E-mail de boas-vindas na chegada, apontando o career center da universidade", "Duplas de destino comunicadas nominalmente, com sugestão de primeiro contato"], ["Semana 2", "Grupos por destino abertos onde houver cinco pessoas ou mais", "Canal de dúvidas divulgado com horário de resposta combinado"], ["Semana 3", "Roda de acolhimento online: financeiro, saúde mental e quem chegou antes", "Considerar duas sessões por causa do fuso"], ["Semana 4", "Envio dos termos para assinatura (código de conduta e consentimento)", "Perguntas do formulário de outubro fechadas com a liderança"]], "paralelo": "Parcerias: montar a lista de 30 alvos e iniciar os primeiros contatos.", "pronto": "Minutas revisadas pelo jurídico até 15/09 e canal de escuta definido.", "dono": "Erina; termos com Larissa e jurídico"}, {"mes": "Outubro 2026", "sub": "escuta e o dado que destrava o ano", "cor": "#C9A24B", "foco": "O formulário de carreira é a peça central do mês. Sem ele, mentoria, parcerias e métricas ficam sem base.", "semanas": [["Semana 1", "Formulário de carreira enviado no dia 1, com explicação do uso de cada bloco", "Meta de resposta combinada com a liderança antes do envio"], ["Semana 2", "Primeiro lembrete no dia 7; segundo no dia 14", "Lembrete pelo canal de avisos, sempre depois do e-mail"], ["Semana 3", "Formulário fecha no dia 21; começa a tabulação", "Separar por estado de retorno e por setor desejado"], ["Semana 4", "Contato individual com quem não respondeu, de 22 a 31", "Fechamento das assinaturas dos termos até 31/10"]], "paralelo": "Parcerias: quinze conversas iniciadas, priorizando os estados de maior retorno.", "pronto": "Perguntas fechadas em setembro e convidado do evento de novembro definido.", "dono": "Erina"}, {"mes": "Novembro 2026", "sub": "primeiro evento e a visita a Londres", "cor": "#1E7A34", "foco": "O mês de maior densidade: o primeiro evento da rede e a visita presencial ao maior hub coincidem.", "semanas": [["Semana 1", "Tabulação do formulário concluída e lida com a liderança", "Define se a mentoria abre em fevereiro"], ["Semana 2", "Primeiro evento da rede, com tema de carreira", "Registrar presença por pessoa para alimentar a classificação de engajamento"], ["Semana 3", "Visita presencial a Londres (ver roteiro sugerido na página de aprofundamento)", "Aproveitar a viagem para adiantar iniciativas já previstas"], ["Semana 4", "Formulário semestral curto e primeira leitura de métricas", "Três acordos de parceria assinados, se o funil de outubro andou"]], "paralelo": "Parcerias: converter as conversas de outubro em acordos assinados.", "pronto": "Roteiro da visita e convidado do evento definidos em outubro.", "dono": "Erina e Larissa"}, {"mes": "Dezembro 2026", "sub": "fecho do semestre e preparação de 2027", "cor": "#7A3E9A", "foco": "Mês curto e de baixa disponibilidade da turma. Serve para consolidar, não para lançar coisa nova.", "semanas": [["Semana 1", "Encontro anual online da rede em mobilidade", "Toda a rede, não só a coorte de 2026"], ["Semana 2", "Revisão da classificação de engajamento no CRM", "Primeira rodada completa: quem subiu, quem sumiu"], ["Semana 3", "Balanço do semestre com a liderança e ajuste do calendário", "Fechar o calendário de 2027 antes do recesso"], ["Semana 4", "Recesso. Nada de envio entre 20/12 e 05/01", "A turma está em provas e viagens; comunicação nesse período não rende"]], "paralelo": "Parcerias: fechar o balanço do ano e definir a meta realista para 2027.", "pronto": "Dados de presença e de resposta consolidados no CRM.", "dono": "Erina e Larissa"}], "parc_passos": {"intro": "A frente de maior valor e a que mais depende de começar cedo, porque acordo institucional demora. O passo a passo abaixo é o caminho da lista fria até o acordo assinado, dimensionado para caber junto com o resto da operação.", "funil": [["30", "organizações-alvo mapeadas", "agosto e setembro"], ["15", "conversas iniciadas", "outubro"], ["8", "propostas apresentadas", "novembro"], ["5", "acordos assinados", "dezembro"]], "funil_nota": "Números de referência para dimensionar o esforço, não compromisso. A taxa de conversão real só se conhece depois do primeiro ciclo; se cair pela metade, a meta de cinco escorrega para 2027 e tudo bem.", "passos": [{"n": "1", "t": "Montar a lista de alvos", "q": "agosto e setembro", "acoes": ["Cruzar o estado de retorno da turma com os setores de maior interesse declarado.", "Puxar da base do Airtable onde os egressos e aprovados trabalham hoje: é a porta de entrada mais quente. function openPanel(id){
  const i=byId[id]; if(!i) return;
  const col=PIL[i.pilar]||"#264CA1";
  document.getElementById('pnh').style.background=col;
  document.getElementById('pnp').textContent=(i.transv?'Transversal':i.fase)+' · '+i.pilar;
  document.getElementById('pnt').textContent=i.nome;
  const rel=D.conex.filter(c=>c.a===id||c.b===id);
  let relH='';
  if(rel.length){
    relH='<div class="ps"><div class="lb">Como se conecta</div><div class="rel">'+rel.map(c=>{
      const out=c.a===id, o=byId[out?c.b:c.a];
      return '<a data-goto="'+(out?c.b:c.a)+'"><span class="dr">'+(out?'→':'←')+'</span><span>'+
        (out? esc(c.l)+' '+esc(o.nome) : esc(o.nome)+' ('+esc(c.l)+')')+'</span></a>';
    }).join('')+'</div></div>';
  }
  document.getElementById('pnbd').innerHTML=
   '<div class="ps"><div class="lb">Objetivo</div><p>'+esc(i.oque)+'</p></div>'+
   '<div class="ps"><div class="lb">Atividades</div><ul>'+(i.acoes.length?i.acoes:["A detalhar na operação."]).map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div>'+
   '<div class="ps"><div class="lb">Governança</div><p>Responsável: '+esc(i.resp||'Instituto')+'. Camada '+esc((i.camada||'').toLowerCase())+
     '. '+(String(i.plat).toLowerCase().startsWith('s')?'Cabe na plataforma futura (hoje manual ou CRM).':'Fora do escopo da plataforma futura.')+'</p></div>'+
   (i.ajuste?'<div class="ps gd"><div class="lb">Ajuste para 2026</div><p>'+esc(i.ajuste)+'</p></div>':'')+
   '<div class="ps"><div class="lb">Quando e classificação</div><div class="chips">'+
     '<span class="chip">'+esc(i.gat)+'</span><span class="chip">Esforço '+esc(i.esforco)+'</span>'+
     '<span class="chip">'+esc(i.publico)+'</span><span class="chip">'+esc(i.cat)+'</span>'+
     '<span class="chip">Custo '+esc(i.custo)+'</span><span class="chip">'+esc(i.design)+'</span></div></div>'+relH;
  document.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click',()=>openPanel(a.dataset.goto)));
  document.getElementById('ov').classList.add('open');
  document.getElementById('pn').classList.add('open');
}
function closePanel(){document.getElementById('ov').classList.remove('open');document.getElementById('pn').classList.remove('open');}

function renderBoard(){
  const gb=document.getElementById('gb'); if(!gb) return;
  const nF=D.fases.length;
  let h='<div class="fh" style="grid-template-columns:repeat('+nF+',1fr)">';
  D.fases.forEach(f=>h+='<div class="fhc"><div class="n">'+f+'</div><div class="t">'+(D.tempo[f]||'')+'</div></div>');
  h+='</div>';
  ["Pertencimento","Carreira","Impacto no Brasil"].forEach(p=>{
    h+='<div class="lane"><div class="ll" style="background:'+PIL[p]+'">'+p+'</div><div class="lc" style="grid-template-columns:repeat('+nF+',1fr)">';
    D.fases.forEach(f=>{h+='<div class="cell">'+D.board.filter(b=>!b.transv&&b.pilar===p&&b.fase===f).map(cardHTML).join('')+'</div>';});
    h+='</div></div>';
  });
  h+='<div class="lane transv"><div class="ll">Transversais</div><div class="tvc"><div class="tvnote">Contínuas: rodam ao longo de toda a jornada, sem fase única</div>'+
     D.board.filter(b=>b.transv).map(cardHTML).join('')+'</div></div>';

}
function drawFlowLinks(){
  const svg=document.getElementById('lksF'), bd=document.getElementById('bdF');
  const pg=document.getElementById('pg-flow');
  if(!svg||!bd||!pg||!pg.classList.contains('on')) return;
  svg.setAttribute('width',bd.scrollWidth); svg.setAttribute('height',bd.scrollHeight);
  const pr=bd.getBoundingClientRect();
  let s='<defs><marker id="aw2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">'+
        '<path d="M0 0L6 3L0 6" fill="none" stroke="#B8BDC4" stroke-width="1.4"/></marker></defs>';
  D.conex.forEach(c=>{
    const A=document.querySelector('#flowGrid .card[data-id="'+c.a+'"]'), B=document.querySelector('#flowGrid .card[data-id="'+c.b+'"]');
    if(!A||!B) return;
    const ra=A.getBoundingClientRect(), rb=B.getBoundingClientRect(), l2r=ra.left<rb.left;
    const p1={x:(l2r?ra.right:ra.left)-pr.left,y:ra.top-pr.top+ra.height/2};
    const p2={x:(l2r?rb.left:rb.right)-pr.left,y:rb.top-pr.top+rb.height/2};
    const dx=Math.max(26,Math.abs(p2.x-p1.x)*0.38);
    s+='<path class="lkf" data-a="'+c.a+'" data-b="'+c.b+'" d="M'+p1.x+' '+p1.y+' C'+(p1.x+(l2r?dx:-dx))+' '+p1.y+' '+
       (p2.x+(l2r?-dx:dx))+' '+p2.y+' '+p2.x+' '+p2.y+'" fill="none" stroke="#C3CBDA" stroke-width="1.5" marker-end="url(#aw2)" opacity=".68"/>';
  });
  svg.innerHTML=s;
}
function drawLinks(){
  const svg=document.getElementById('lks'), bd=document.getElementById('bd');
  const pg=document.getElementById('pg-board');
  if(!svg||!bd||!pg||!pg.classList.contains('on')) return;
  svg.setAttribute('width',bd.scrollWidth); svg.setAttribute('height',bd.scrollHeight);
  const pr=bd.getBoundingClientRect();
  let s='<defs><marker id="aw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">'+
        '<path d="M0 0L6 3L0 6" fill="none" stroke="#B8BDC4" stroke-width="1.4"/></marker></defs>';
  D.conex.forEach(c=>{
    const A=document.querySelector('#gb .card[data-id="'+c.a+'"]'), B=document.querySelector('#gb .card[data-id="'+c.b+'"]');
    if(!A||!B) return;
    const ra=A.getBoundingClientRect(), rb=B.getBoundingClientRect(), l2r=ra.left<rb.left;
    const p1={x:(l2r?ra.right:ra.left)-pr.left,y:ra.top-pr.top+ra.height/2};
    const p2={x:(l2r?rb.left:rb.right)-pr.left,y:rb.top-pr.top+rb.height/2};
    const dx=Math.max(28,Math.abs(p2.x-p1.x)*0.4);
    s+='<path class="lk" data-a="'+c.a+'" data-b="'+c.b+'" d="M'+p1.x+' '+p1.y+' C'+(p1.x+(l2r?dx:-dx))+' '+p1.y+' '+
       (p2.x+(l2r?-dx:dx))+' '+p2.y+' '+p2.x+' '+p2.y+'" fill="none" stroke="#C3CBDA" stroke-width="1.6" marker-end="url(#aw)" opacity=".72"/>';
  });
  svg.innerHTML=s;
}
function bindAll(){
  document.querySelectorAll('.card').forEach(c=>{
    const id=c.dataset.id;
    c.onclick=()=>openPanel(id);
    c.onmouseenter=()=>{
      const inFlow=document.getElementById('pg-flow').classList.contains('on');
      const inBoard=document.getElementById('pg-board').classList.contains('on');
      if(!inBoard&&!inFlow) return;
      if(inFlow){
        const rel=new Set([id]); D.conex.forEach(x=>{if(x.a===id)rel.add(x.b);if(x.b===id)rel.add(x.a);});
        document.querySelectorAll('#flowGrid .card').forEach(o=>o.classList.toggle('dim',!rel.has(o.dataset.id)));
        c.classList.add('hi');
        document.querySelectorAll('.lkf').forEach(l=>{
          const on=(l.dataset.a===id||l.dataset.b===id);
          l.setAttribute('stroke',on?'#C9A24B':'#DDE3EC');l.setAttribute('stroke-width',on?'2.4':'1');l.setAttribute('opacity',on?'1':'.35');
        });
        return;
      }
      const rel=new Set([id]); D.conex.forEach(x=>{if(x.a===id)rel.add(x.b);if(x.b===id)rel.add(x.a);});
      document.querySelectorAll('#gb .card').forEach(o=>o.classList.toggle('dim',!rel.has(o.dataset.id)));
      c.classList.add('hi');
      document.querySelectorAll('.lk').forEach(l=>{
        const on=(l.dataset.a===id||l.dataset.b===id);
        l.setAttribute('stroke',on?'#C9A24B':'#DDE3EC');l.setAttribute('stroke-width',on?'2.4':'1');l.setAttribute('opacity',on?'1':'.4');
      });
    };
    c.onmouseleave=()=>{
      document.querySelectorAll('.card').forEach(o=>o.classList.remove('dim','hi'));
      document.querySelectorAll('.lkf').forEach(l=>{l.setAttribute('stroke','#C3CBDA');l.setAttribute('stroke-width','1.5');l.setAttribute('opacity','.68');});
      document.querySelectorAll('.lk').forEach(l=>{l.setAttribute('stroke','#C3CBDA');l.setAttribute('stroke-width','1.6');l.setAttribute('opacity','.72');});
    };
  });
  document.querySelectorAll('.mit[data-id]').forEach(m=>{m.onclick=()=>openPanel(m.dataset.id);});
}

   dif:[["Baixo esforço","#1E7A34"],["Médio","#C9A24B"],["Alto","#B03A2E"]],

function reflowCards(){
  document.querySelectorAll('#flowGrid .card, .grid .card').forEach(c=>{
    const b=byId[c.dataset.id]; if(!b) return;
    const col=colorOf(b);
    c.style.borderLeftColor=col;
    const ic=c.querySelector('.ic'); if(ic) ic.style.color=col;
  });

/* ============ BUSCA ============ */
const PAGE_INDEX=[];
MENU.forEach(m=>m.items.forEach(i=>PAGE_INDEX.push({id:i[0],nome:i[1],desc:i[2],grupo:m.g})));
function runSearch(q){
  const box=document.getElementById('sres');
  q=(q||'').trim().toLowerCase();
  if(q.length<2){box.classList.remove('open');box.innerHTML='';return;}
  const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const qq=norm(q);
  const pgs=PAGE_INDEX.filter(p=>norm(p.nome).includes(qq)||norm(p.desc).includes(qq)||norm(p.grupo).includes(qq));
  const inis=D.board.filter(b=>norm(b.nome).includes(qq)||norm(b.oque).includes(qq)||
    (b.acoes||[]).some(a=>norm(a).includes(qq))).slice(0,12);
  let h='';
  if(pgs.length){h+='<div class="sg">Páginas</div>'+pgs.map(p=>
    '<button data-k="p" data-v="'+p.id+'"><div class="st">'+esc(p.nome)+'</div><div class="sc">'+esc(p.grupo)+' · '+esc(p.desc)+'</div></button>').join('');}
  if(inis.length){h+='<div class="sg">Iniciativas</div>'+inis.map(b=>
    '<button data-k="i" data-v="'+b.id+'"><div class="st">'+esc(b.nome)+'</div><div class="sc">'+esc(b.transv?'Transversal':b.fase)+' · '+esc(b.pilar)+'</div></button>').join('');}
  if(!h) h='<div class="empty">Nada encontrado para "'+esc(q)+'".</div>';
  box.innerHTML=h; box.classList.add('open');
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    box.classList.remove('open'); document.getElementById('q').value='';
    if(b.dataset.k==='p') go(b.dataset.v); else openPanel(b.dataset.v);
  }));
}

/* ============ BOOT ============ */
function go(id){
  const pg=document.getElementById('pg-'+id); if(!pg) id="board";
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='pg-'+id));
  document.querySelectorAll('.dd button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));
  document.querySelectorAll('.menu').forEach(m=>m.classList.toggle('act',!!m.querySelector('.dd button[data-p="'+id+'"].on')));
  window.scrollTo(0,0);
  if(id==='board') requestAnimationFrame(drawLinks);
  if(id==='flow') requestAnimationFrame(drawFlowLinks);
  try{ history.replaceState(null,'','#'+id); }catch(e){ /* contexto restrito: navegação segue sem atualizar o endereço */ }
}
function buildNav(){
  const nv=document.getElementById('navIn');
  MENU.forEach(m=>{
    const d=document.createElement('div'); d.className='menu';
    d.innerHTML='<button type="button">'+m.g+' <span class="car">▼</span></button><div class="dd">'+
      m.items.map(i=>'<button type="button" data-p="'+i[0]+'">'+i[1]+'<small>'+i[2]+'</small></button>').join('')+'</div>';
    d.firstChild.addEventListener('click',e=>{
      e.stopPropagation();
      const was=d.classList.contains('open');
      document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));
      if(!was) d.classList.add('open');
    });
    d.querySelectorAll('.dd button').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation(); go(b.dataset.p); document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));
    }));
    nv.appendChild(d);
  });
  document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));
}
document.getElementById('main').innerHTML=[pgInicio(),pgEstrategia(),pgVoz(),pgTurma(),pgBoard(),pgFlow(),pgPlan(),pgCapacidade(),pgParcerias(),pgCompliance(),pgCarreira(),pgComunic(),pgNiveis(),pgMetricas(),
  pgDecisoes(),pgEditais(),pgBench(),pgBacklog(),pgLegenda(),pgPlataforma(),pgCal(),pgRotina(),pgComoFazer(),pgVisita(),pgLinks()].join('');
buildNav(); renderBoard(); drawLegend();
document.getElementById('pnc').addEventListener('click',closePanel);
document.getElementById('ov').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.m; drawLegend(); renderBoard(); reflowCards();
}));
document.addEventListener('click',e=>{
  const g=e.target.closest('.goto'); if(g){ closePanel(); go(g.dataset.go); return; }
  const cf=e.target.closest('#canFilt .pill');
  if(cf){
    document.querySelectorAll('#canFilt .pill').forEach(x=>x.classList.remove('on')); cf.classList.add('on');
    const v=cf.dataset.c;
    document.querySelectorAll('.reguaT tr[data-canal]').forEach(tr=>{
      tr.style.display=(v==='__all'||tr.dataset.canal.indexOf(v)>=0)?'':'none';
    });
    document.querySelectorAll('.reguaT').forEach(t=>{
      const vis=t.querySelectorAll('tr[data-canal]:not([style*="none"])').length;
      const hd=t.previousElementSibling;
      t.style.display=vis?'':'none'; if(hd&&hd.classList.contains('sec')) hd.style.display=vis?'':'none';
    });
    return;
  }
  const p=e.target.closest('#decFilt .pill'); if(!p) return;
  document.querySelectorAll('#decFilt .pill').forEach(x=>x.classList.remove('on')); p.classList.add('on');
  const f=p.dataset.f;
  document.querySelectorAll('#decGrid .dec').forEach(d=>{d.style.display=(f==='__all'||d.dataset.cat===f)?'':'none';});
});
document.getElementById('q').addEventListener('input',e=>runSearch(e.target.value));
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';runSearch('');}});
document.addEventListener('click',e=>{if(!e.target.closest('.srch')) document.getElementById('sres').classList.remove('open');});
window.addEventListener('resize',()=>{requestAnimationFrame(drawLinks);requestAnimationFrame(drawFlowLinks);});
var _ini='inicio';
try{ if(location.hash&&location.hash.length>1) _ini=location.hash.slice(1); }catch(e){}
go(_ini);
})();
</script>
